name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "30 18 * * *" # daily, offset from the 3D-contrib workflow to avoid push races
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 5
          EXCLUDE: "jupyter notebook,tex"
          THEME: "github"
          AUTO_PUSH: false
      # the action wipes the output dir per-theme, so stash the light set
      - run: cp -r profile-summary-card-output/github /tmp/cards-light
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 5
          EXCLUDE: "jupyter notebook,tex"
          THEME: "github_dark"
          AUTO_PUSH: false
      - name: Commit & Push
        run: |
          cp -r /tmp/cards-light profile-summary-card-output/github
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-summary-card-output
          git commit -m "generate profile summary cards" || echo "no changes"
          git pull --rebase origin main
          git push
